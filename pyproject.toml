[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qora-tts"
version = "0.1.0"
description = "Cloud-first Kinyarwanda TTS research pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=4.4.1",
  "huggingface_hub>=1.16.1",
  "kaggle>=2.1.2",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18.2",
  "pytest>=8.4.2",
  "ruff>=0.14.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qora_tts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qora_tts"]

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*", "huggingface_hub", "huggingface_hub.*", "yaml"]
ignore_missing_imports = true
