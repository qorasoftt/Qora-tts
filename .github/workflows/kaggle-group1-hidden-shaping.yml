name: Kaggle Group1 Hidden Shaping

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "kaggle/group1_hidden_shaping_probe/**"
      - "scripts/prepare_kaggle_kernel.py"
      - "scripts/poll_kaggle_kernel.py"
      - ".github/workflows/kaggle-group1-hidden-shaping.yml"

jobs:
  group1:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KERNEL_SLUG: qora-tts-group1-hidden-shaping-probe
      KERNEL_TITLE: Qora TTS Group1 Hidden Shaping Probe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install kaggle

      - name: Validate required secrets
        run: |
          test -n "$KAGGLE_API_TOKEN"
          test -n "$KAGGLE_USERNAME"

      - name: Configure Kaggle auth
        run: |
          mkdir -p "$HOME/.kaggle"
          printf "%s" "$KAGGLE_API_TOKEN" > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"

      - name: Rewrite kernel metadata
        run: |
          python scripts/prepare_kaggle_kernel.py \
            --kernel-dir kaggle/group1_hidden_shaping_probe \
            --username "$KAGGLE_USERNAME" \
            --slug "$KERNEL_SLUG" \
            --title "$KERNEL_TITLE" \
            --internet true \
            --gpu true

      - name: Push Kaggle kernel
        run: kaggle kernels push -p kaggle/group1_hidden_shaping_probe

      - name: Poll Kaggle kernel
        run: python scripts/poll_kaggle_kernel.py --kernel "$KAGGLE_USERNAME/$KERNEL_SLUG" --timeout-seconds 10800

      - name: Download Kaggle outputs
        if: always()
        run: kaggle kernels output "$KAGGLE_USERNAME/$KERNEL_SLUG" -p artifacts/group1_hidden_shaping_output || true

      - name: Upload Kaggle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-group1-hidden-shaping-output
          path: artifacts/group1_hidden_shaping_output
          if-no-files-found: ignore
